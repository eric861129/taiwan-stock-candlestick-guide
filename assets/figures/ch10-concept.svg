<desc id="chart-desc">人工日 K 線圖。前段先有下跌實體，接著出現實體完整包含它的上漲外包線；中段出現三根連續推進；右端三根實體缺少本書要求的完整星形分離，因此保留為候選。紅色空心與綠色實心以圖例和 OHLC 關係輔助判讀。</desc>
