name: 十年市場歷史基準

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 要建立基準的完整 Git commit SHA；留空使用觸發此 workflow 的 commit。
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: market-history-bootstrap
  cancel-in-progress: false

jobs:
  resolve-source:
    name: 鎖定十年基準 source commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - id: resolve
        name: Validate immutable source SHA
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source SHA 必須是完整的小寫 Git commit SHA。" >&2
            exit 1
          fi
          echo "source_sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: 驗證鎖定的 source
    needs: resolve-source
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}

  bootstrap:
    name: 建立可續跑十年全市場基準
    needs:
      - resolve-source
      - verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - id: restore-history-cache
        name: Restore resumable ten-year market history cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-history-v1-${{ github.repository_id }}-

      - name: Prepare market history cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market-snapshot-cache"

      - name: Build and validate the ten-year baseline
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/market_snapshot.py bootstrap \
            --output "$RUNNER_TEMP/bootstrap-snapshot" \
            --source-commit "$SOURCE_SHA" \
            --cache "$RUNNER_TEMP/market-snapshot-cache"
          python tools/market_snapshot.py validate --snapshot "$RUNNER_TEMP/bootstrap-snapshot"

      - id: snapshot-name
        name: Name the verified bootstrap snapshot
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/bootstrap-snapshot/manifest.json" "$SOURCE_SHA" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          source_sha = sys.argv[2]
          if manifest.get("sourceCommit") != source_sha:
              raise SystemExit("十年基準 manifest 的 sourceCommit 與鎖定 source SHA 不一致。")
          markets = manifest.get("markets")
          if not isinstance(markets, dict):
              raise SystemExit("十年基準 manifest 缺少 markets。")
          cutoffs = {value.get("cutoffDate") for value in markets.values() if isinstance(value, dict)}
          if len(cutoffs) != 1:
              raise SystemExit("十年基準兩市場 cutoff 不一致。")
          cutoff = cutoffs.pop()
          if not isinstance(cutoff, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", cutoff):
              raise SystemExit("十年基準 cutoff 格式無效。")
          print(f"snapshot_artifact_name=market-snapshot-{cutoff}-{source_sha[:12]}")
          PY

      - name: Upload verified baseline snapshot for the Pages workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.snapshot-name.outputs.snapshot_artifact_name }}
          path: |
            ${{ runner.temp }}/bootstrap-snapshot/snapshot.tar.gz
            ${{ runner.temp }}/bootstrap-snapshot/manifest.json
            ${{ runner.temp }}/bootstrap-snapshot/provenance.json
            ${{ runner.temp }}/bootstrap-snapshot/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Save resumable ten-year market history cache
        if: ${{ always() }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
