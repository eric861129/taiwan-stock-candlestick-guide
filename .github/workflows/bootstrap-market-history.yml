name: 十年市場歷史基準

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 要建立基準的完整 Git commit SHA；留空使用觸發此 workflow 的 commit。
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: market-history-bootstrap
  cancel-in-progress: false

jobs:
  resolve-source:
    name: 鎖定十年基準 source commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - id: resolve
        name: Validate immutable source SHA
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "十年基準只允許從正式 main 分支簽署。" >&2
            exit 1
          fi
          if ! [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source SHA 必須是完整的小寫 Git commit SHA。" >&2
            exit 1
          fi
          if [[ "$REQUESTED_SOURCE_SHA" != "$WORKFLOW_SOURCE_SHA" ]]; then
            echo "十年基準只能簽署本次 main workflow 的 source SHA。" >&2
            exit 1
          fi
          echo "source_sha=$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: 驗證鎖定的 source
    needs: resolve-source
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}

  bootstrap:
    name: 建立可續跑十年全市場基準
    needs:
      - resolve-source
      - verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      snapshot_hash: ${{ steps.create-validation-receipt.outputs.snapshot_hash }}
      cutoff_date: ${{ steps.create-validation-receipt.outputs.cutoff_date }}
      market_artifact_id: ${{ steps.market-artifact-provenance.outputs.artifact_id }}
      market_artifact_digest: ${{ steps.market-artifact-provenance.outputs.artifact_digest }}
      attestation_id: ${{ steps.market-artifact-provenance.outputs.attestation_id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --no-tags --unshallow origin refs/heads/main:refs/remotes/origin/main
          else
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/main; then
            echo "source SHA 不在正式 main 歷史中，拒絕簽署。" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - id: restore-history-cache
        name: Restore resumable ten-year market history cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-history-v1-${{ github.repository_id }}-

      - name: Prepare market history cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market-snapshot-cache"

      - name: Build and validate the ten-year baseline
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          MARKET_VALIDATOR_TIMING_OUTPUT: ${{ runner.temp }}/market-validator-timing.json
        shell: bash
        run: |
          set -euo pipefail
          python tools/market_snapshot.py bootstrap \
            --output "$RUNNER_TEMP/bootstrap-snapshot" \
            --source-commit "$SOURCE_SHA" \
            --cache "$RUNNER_TEMP/market-snapshot-cache"
          python - "$MARKET_VALIDATOR_TIMING_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          timing = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if timing.get("fullValidatorCount") != 1:
              raise SystemExit("十年基準候選完整 validator 次數不是 1。")
          PY

      - id: create-validation-receipt
        name: Create validation receipt after the complete validator
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          VALIDATOR_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/market_snapshot_receipt.py create \
            --archive "$RUNNER_TEMP/bootstrap-snapshot/snapshot.tar.gz" \
            --output "$RUNNER_TEMP/bootstrap-snapshot/validation-receipt.json" \
            --market-source-commit "$SOURCE_SHA" \
            --validator-source-commit "$VALIDATOR_SOURCE_SHA" \
            --repository-root "$GITHUB_WORKSPACE"
          python - "$RUNNER_TEMP/bootstrap-snapshot/validation-receipt.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          snapshot = receipt.get("snapshot")
          if not isinstance(snapshot, dict):
              raise SystemExit("validation receipt 缺少 snapshot。")
          snapshot_hash = snapshot.get("snapshotHash")
          cutoff_date = snapshot.get("cutoffDate")
          if not isinstance(snapshot_hash, str) or re.fullmatch(r"[0-9a-f]{64}", snapshot_hash) is None:
              raise SystemExit("validation receipt 缺少有效 snapshotHash。")
          if not isinstance(cutoff_date, str) or re.fullmatch(r"\d{4}-\d{2}-\d{2}", cutoff_date) is None:
              raise SystemExit("validation receipt 缺少有效 cutoffDate。")
          print(f"snapshot_hash={snapshot_hash}")
          print(f"cutoff_date={cutoff_date}")
          PY

      - id: snapshot-name
        name: Name the verified bootstrap snapshot
        env:
          SNAPSHOT_HASH: ${{ steps.create-validation-receipt.outputs.snapshot_hash }}
          CUTOFF_DATE: ${{ steps.create-validation-receipt.outputs.cutoff_date }}
          MARKET_VALIDATOR_TIMING_OUTPUT: ${{ runner.temp }}/market-validator-timing.json
        shell: bash
        run: |
          set -euo pipefail
          python - "$SNAPSHOT_HASH" "$CUTOFF_DATE" <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import sys

          snapshot_hash, cutoff_date = sys.argv[1:]
          if re.fullmatch(r"[0-9a-f]{64}", snapshot_hash) is None:
              raise SystemExit("validation receipt 的 snapshotHash 無效。")
          if re.fullmatch(r"\d{4}-\d{2}-\d{2}", cutoff_date) is None:
              raise SystemExit("validation receipt 的 cutoffDate 無效。")
          print(f"snapshot_artifact_name=market-snapshot-{snapshot_hash}")
          PY

      - id: attest-market-snapshot
        name: Attest the validated market snapshot
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/bootstrap-snapshot/snapshot.tar.gz
          predicate-type: https://eric861129.github.io/attestations/market-snapshot-validation/v1
          predicate-path: ${{ runner.temp }}/bootstrap-snapshot/validation-receipt.json
          create-storage-record: false

      - id: upload-market-snapshot
        name: Upload immutable verified baseline snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.snapshot-name.outputs.snapshot_artifact_name }}
          path: |
            ${{ runner.temp }}/bootstrap-snapshot/snapshot.tar.gz
            ${{ runner.temp }}/bootstrap-snapshot/snapshot.tar.gz.sha256
            ${{ runner.temp }}/bootstrap-snapshot/validation-receipt.json
          if-no-files-found: error
          retention-days: 30

      - id: market-artifact-provenance
        name: Record immutable market artifact provenance
        env:
          ARTIFACT_ID: ${{ steps.upload-market-snapshot.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-market-snapshot.outputs.artifact-digest }}
          ATTESTATION_ID: ${{ steps.attest-market-snapshot.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-market-snapshot.outputs.attestation-url }}
          SNAPSHOT_HASH: ${{ steps.create-validation-receipt.outputs.snapshot_hash }}
          CUTOFF_DATE: ${{ steps.create-validation-receipt.outputs.cutoff_date }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "市場 Artifact 缺少有效 ID。" >&2
            exit 1
          fi
          ARTIFACT_DIGEST="$(python tools/market_snapshot_attestation.py normalize-artifact-digest --value "$ARTIFACT_DIGEST")"
          validator_seconds="$(python - "$MARKET_VALIDATOR_TIMING_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["fullValidatorSeconds"])
          PY
          )"
          if ! [[ "$ATTESTATION_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "市場 Attestation 缺少有效 ID。" >&2
            exit 1
          fi
          {
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "attestation_id=$ATTESTATION_ID"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 已簽署市場 Snapshot"
            echo "- Snapshot hash：\`$SNAPSHOT_HASH\`"
            echo "- 資料截止日：\`$CUTOFF_DATE\`"
            echo "- Artifact ID：\`$ARTIFACT_ID\`"
            echo "- Artifact digest：\`$ARTIFACT_DIGEST\`"
            echo "- 候選完整 validator 次數：\`1\`"
            echo "- 候選完整 validator：\`${validator_seconds}s\`"
            echo "- Attestation：[\`$ATTESTATION_ID\`]($ATTESTATION_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save resumable ten-year market history cache
        if: ${{ always() }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
