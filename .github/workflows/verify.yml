name: 驗證網站與教材

on:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        description: 要驗證的不可變完整 Git commit SHA。
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: 離線發布驗證
    runs-on: ubuntu-latest
    steps:
      - id: validate-source
        name: Validate requested source SHA before checkout
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source SHA 必須是完整的小寫 Git commit SHA。" >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$REQUESTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.validate-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm immutable source checkout
        env:
          VALIDATED_SOURCE_SHA: ${{ steps.validate-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$VALIDATED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $VALIDATED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Verify Python contracts and generated glossary
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          python tools/validate_book.py
          python tools/render_glossary.py --source CONTEXT.md --output chapters/appendix-d-glossary.md --check

      - name: Verify frontend contracts and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit:coverage
          npm run build
