name: 原子化 GitHub Pages 部署

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      source_sha:
        description: 要部署的不可變完整 Git commit SHA。
        required: true
        type: string
      rollback_artifact_id:
        description: 成功 market-snapshot artifact 的 GitHub artifact ID；網站與市場資料依 deployment metadata 分別 rollback。
        required: false
        default: ""
        type: string
      skip_if_same_cutoff:
        description: 僅排程使用；官方資料日期未變時成功 no-op 而不部署。
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      source_sha:
        description: 正常部署時要使用的完整 Git commit SHA；留空使用觸發此 workflow 的 commit。
        required: false
        default: ""
        type: string
      rollback_artifact_id:
        description: 成功 market-snapshot artifact 的 GitHub artifact ID；提供時忽略 source_sha。
        required: false
        default: ""
        type: string
      skip_if_same_cutoff:
        description: 官方資料日期相同時不建立新部署；日常手動部署請保留 false。
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  resolve-source:
    name: 鎖定 source commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      rollback_artifact_id: ${{ steps.resolve.outputs.rollback_artifact_id }}
      rollback_run_id: ${{ steps.validate-rollback.outputs.rollback_run_id }}
    steps:
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - id: validate-rollback
        name: Validate rollback artifact is a completed successful snapshot
        if: ${{ inputs.rollback_artifact_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLLBACK_ARTIFACT_ID: ${{ inputs.rollback_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          artifact_id = os.environ["ROLLBACK_ARTIFACT_ID"]
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              raise SystemExit("rollback_artifact_id 必須是正整數 GitHub artifact ID。")

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def fetch(path: str) -> dict[str, object]:
              request = Request(
                  f"{api}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "taiwan-stock-candlestick-guide",
                  },
              )
              with urlopen(request, timeout=30) as response:  # nosec B310: fixed GitHub API origin
                  return json.load(response)

          artifact = fetch(f"/repos/{repository}/actions/artifacts/{artifact_id}")
          name = artifact.get("name")
          if artifact.get("expired") or not isinstance(name, str) or not name.startswith("market-snapshot-"):
              raise SystemExit("rollback_artifact_id 不是可用的成功 market-snapshot artifact。")
          workflow_run = artifact.get("workflow_run")
          workflow_run_id = workflow_run.get("id") if isinstance(workflow_run, dict) else None
          if isinstance(workflow_run_id, bool) or not isinstance(workflow_run_id, int) or workflow_run_id < 1:
              raise SystemExit("rollback artifact 缺少 workflow run 記錄。")
          run = fetch(f"/repos/{repository}/actions/runs/{workflow_run_id}")
          if run.get("conclusion") != "success":
              raise SystemExit("rollback artifact 所屬 workflow 尚未成功完成。")
          workflow_path = run.get("path")
          head_branch = run.get("head_branch")
          head_repository = run.get("head_repository")
          repository_name = (
              head_repository.get("full_name") if isinstance(head_repository, dict) else None
          )
          allowed_workflows = {
              ".github/workflows/deploy-pages.yml",
              ".github/workflows/bootstrap-market-history.yml",
              ".github/workflows/update-market-data.yml",
          }
          if (
              workflow_path not in allowed_workflows
              or head_branch != "main"
              or repository_name != repository
          ):
              raise SystemExit("rollback artifact 不是由本 repository main 的可信市場 workflow 建立。")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"rollback_artifact_id={artifact_id}\n")
              output.write(f"rollback_run_id={workflow_run_id}\n")
              output.write(f"rollback_workflow_path={workflow_path}\n")
          PY

      - name: Download selected rollback metadata
        if: ${{ inputs.rollback_artifact_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.validate-rollback.outputs.rollback_artifact_id }}
          path: ${{ runner.temp }}/rollback-source-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validate-rollback.outputs.rollback_run_id }}

      - id: resolve
        name: Resolve immutable source SHA
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          ROLLBACK_ARTIFACT_ID: ${{ steps.validate-rollback.outputs.rollback_artifact_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ROLLBACK_ARTIFACT_ID" ]]; then
            mapfile -t artifact_files < <(find "$RUNNER_TEMP/rollback-source-artifact" -type f -print)
            artifact_names="$(printf '%s\n' "${artifact_files[@]##*/}" | sort)"
            if [[ "$artifact_names" != $'SHA256SUMS\nmanifest.json\nprovenance.json\nsnapshot.tar.gz' ]] && \
               [[ "$artifact_names" != $'SHA256SUMS\ndeployment.json\nmanifest.json\nprovenance.json\nsnapshot.tar.gz' ]]; then
              echo "rollback artifact 必須是可信的四檔舊快照或五檔版本分離快照。" >&2
              exit 1
            fi
            mapfile -t manifest_paths < <(find "$RUNNER_TEMP/rollback-source-artifact" -type f -name manifest.json -print)
            if [[ "${#manifest_paths[@]}" -ne 1 ]]; then
              echo "rollback artifact 必須且只能包含一份 manifest.json。" >&2
              exit 1
            fi
            mapfile -t deployment_paths < <(find "$RUNNER_TEMP/rollback-source-artifact" -type f -name deployment.json -print)
            if [[ "${#deployment_paths[@]}" -gt 1 ]]; then
              echo "rollback artifact 不可包含多份 deployment.json。" >&2
              exit 1
            fi
            source_sha="$(PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools" python - \
              "${manifest_paths[0]}" \
              "${deployment_paths[0]:-}" <<'PY'
          import sys
          from pathlib import Path

          from deployment_versions import load_deployment_version

          deployment_path = Path(sys.argv[2]) if sys.argv[2] else None
          version = load_deployment_version(Path(sys.argv[1]), deployment_path)
          print(version.website_source_commit)
          PY
            )"
            mode=rollback
          else
            source_sha="$REQUESTED_SOURCE_SHA"
            mode=update
          fi
          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source SHA 必須是完整的小寫 Git commit SHA。" >&2
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "mode=$mode"
            echo "rollback_artifact_id=$ROLLBACK_ARTIFACT_ID"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: 驗證鎖定的 source
    needs: resolve-source
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}

  source-snapshot:
    name: 建立或還原已驗證市場快照
    needs:
      - resolve-source
      - verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.make-snapshot.outputs.should_deploy }}
      candidate_artifact_name: ${{ steps.make-snapshot.outputs.candidate_artifact_name }}
      snapshot_artifact_name: ${{ steps.make-snapshot.outputs.snapshot_artifact_name }}
      snapshot_strategy: ${{ steps.make-snapshot.outputs.snapshot_strategy }}
      market_data_source_sha: ${{ steps.make-snapshot.outputs.market_data_source_sha }}
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Confirm immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - id: find-previous
        name: Find the previous successful market snapshot
        if: ${{ needs.resolve-source.outputs.mode == 'update' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python .workflow-helper/tools/github_actions_artifacts.py \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --max-pages 10 >> "$GITHUB_OUTPUT"

      - name: Download selected rollback snapshot
        if: ${{ needs.resolve-source.outputs.mode == 'rollback' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.resolve-source.outputs.rollback_artifact_id }}
          path: ${{ runner.temp }}/rollback-snapshot-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-source.outputs.rollback_run_id }}

      - name: Download previous successful snapshot
        if: ${{ needs.resolve-source.outputs.mode == 'update' && steps.find-previous.outputs.artifact_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.find-previous.outputs.artifact_id }}
          path: ${{ runner.temp }}/previous-snapshot-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-previous.outputs.artifact_run_id }}

      - id: restore-previous
        name: Restore and verify the selected snapshot artifact
        if: ${{ needs.resolve-source.outputs.mode == 'rollback' || steps.find-previous.outputs.artifact_id != '' }}
        env:
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_MODE" == "rollback" ]]; then
            artifact_root="$RUNNER_TEMP/rollback-snapshot-artifact"
          else
            artifact_root="$RUNNER_TEMP/previous-snapshot-artifact"
          fi
          mapfile -t artifact_files < <(find "$artifact_root" -type f -print)
          artifact_names="$(printf '%s\n' "${artifact_files[@]##*/}" | sort)"
          if [[ "$artifact_names" != $'SHA256SUMS\nmanifest.json\nprovenance.json\nsnapshot.tar.gz' ]] && \
             [[ "$artifact_names" != $'SHA256SUMS\ndeployment.json\nmanifest.json\nprovenance.json\nsnapshot.tar.gz' ]]; then
            echo "市場 snapshot artifact 必須包含四個快照檔案，可另含一份 deployment.json。" >&2
            exit 1
          fi
          for required in SHA256SUMS manifest.json provenance.json snapshot.tar.gz; do
            mapfile -t matches < <(find "$artifact_root" -type f -name "$required" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "市場 snapshot artifact 的 $required 不可缺漏或重複。" >&2
              exit 1
            fi
            declare "artifact_${required//./_}=${matches[0]}"
          done
          mapfile -t deployment_matches < <(find "$artifact_root" -type f -name deployment.json -print)
          if [[ "${#deployment_matches[@]}" -gt 1 ]]; then
            echo "市場 snapshot artifact 不可包含多份 deployment.json。" >&2
            exit 1
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools:$GITHUB_WORKSPACE/tools" python - \
            "$artifact_snapshot_tar_gz" \
            "$artifact_manifest_json" \
            "$artifact_provenance_json" \
            "$artifact_SHA256SUMS" \
            "$RUNNER_TEMP/previous-snapshot" \
            "${deployment_matches[0]:-}" <<'PY'
          from pathlib import Path
          from shutil import copytree
          import sys

          from deployment_versions import load_deployment_version
          from market_snapshot import _extract_previous_snapshot_archive, validate_snapshot

          archive = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          provenance_path = Path(sys.argv[3])
          sums_path = Path(sys.argv[4])
          destination = Path(sys.argv[5])
          deployment_path = Path(sys.argv[6]) if sys.argv[6] else None
          if destination.exists():
              raise SystemExit("還原快照目錄已存在，拒絕混入舊檔案。")

          extracted = _extract_previous_snapshot_archive(archive)
          for name, external_path in {
              "manifest.json": manifest_path,
              "provenance.json": provenance_path,
              "SHA256SUMS": sums_path,
              "snapshot.tar.gz": archive,
          }.items():
              if external_path.read_bytes() != (extracted / name).read_bytes():
                  raise SystemExit(f"市場 snapshot artifact 的 {name} 與 archive 內容不一致。")
          copytree(extracted, destination)
          validate_snapshot(destination)
          load_deployment_version(manifest_path, deployment_path)
          PY
          echo "previous_snapshot=$RUNNER_TEMP/previous-snapshot" >> "$GITHUB_OUTPUT"

      - id: snapshot-plan
        name: 分離網站程式版本與市場資料版本
        if: ${{ needs.resolve-source.outputs.mode == 'rollback' || steps.restore-previous.outputs.previous_snapshot != '' }}
        env:
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
          PREVIOUS_SNAPSHOT: ${{ steps.restore-previous.outputs.previous_snapshot }}
          SKIP_IF_SAME_CUTOFF: ${{ inputs.skip_if_same_cutoff || false }}
          WEBSITE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          market_data_source_sha="$(python - "$PREVIOUS_SNAPSHOT/manifest.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          source_commit = manifest.get("sourceCommit")
          if not isinstance(source_commit, str) or not re.fullmatch(r"[0-9a-f]{40}", source_commit):
              raise SystemExit("前一成功快照缺少有效 market-data source SHA。")
          print(source_commit)
          PY
          )"

          if [[ "$DEPLOY_MODE" == "rollback" ]]; then
            {
              echo "snapshot_strategy=rollback"
              echo "market_data_source_sha=$market_data_source_sha"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP_IF_SAME_CUTOFF" == "true" ]]; then
            # 平日排程必須查詢官方行情；相同 cutoff 仍由 update 安全 no-op。
            {
              echo "snapshot_strategy=refresh"
              echo "market_data_source_sha=$market_data_source_sha"
            } >> "$GITHUB_OUTPUT"
          else
            python .workflow-helper/tools/deployment_snapshot_mode.py \
              --repository "$GITHUB_WORKSPACE" \
              --market-data-source-sha "$market_data_source_sha" \
              --website-source-sha "$WEBSITE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - id: restore-history-cache
        name: Restore resumable ten-year market history cache
        if: ${{ needs.resolve-source.outputs.mode == 'update' && steps.snapshot-plan.outputs.snapshot_strategy != 'reuse' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-history-v1-${{ github.repository_id }}-

      - name: Prepare market history cache directory
        if: ${{ needs.resolve-source.outputs.mode == 'update' && steps.snapshot-plan.outputs.snapshot_strategy != 'reuse' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market-snapshot-cache"

      - id: make-snapshot
        name: 建立或重用已驗證的市場快照
        env:
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
          MARKET_DATA_SOURCE_SHA: ${{ steps.snapshot-plan.outputs.market_data_source_sha }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          PREVIOUS_SNAPSHOT: ${{ steps.restore-previous.outputs.previous_snapshot }}
          SNAPSHOT_STRATEGY: ${{ steps.snapshot-plan.outputs.snapshot_strategy }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate-snapshot"
          if [[ "$DEPLOY_MODE" == "rollback" ]]; then
            mkdir -p "$candidate"
            cp -a "$PREVIOUS_SNAPSHOT/." "$candidate/"
            effective_market_data_source_sha="$MARKET_DATA_SOURCE_SHA"
          elif [[ -n "$PREVIOUS_SNAPSHOT" ]]; then
            if [[ "$SNAPSHOT_STRATEGY" == "reuse" ]]; then
              echo "純前端／教材變更：重用已驗證市場快照，不呼叫行情 API。"
              mkdir -p "$candidate"
              cp -a "$PREVIOUS_SNAPSHOT/." "$candidate/"
              effective_market_data_source_sha="$MARKET_DATA_SOURCE_SHA"
            elif [[ "$SNAPSHOT_STRATEGY" == "rebuild" || "$SNAPSHOT_STRATEGY" == "refresh" ]]; then
              rebuild_same_cutoff=()
              if [[ "$SNAPSHOT_STRATEGY" == "rebuild" ]]; then
                rebuild_same_cutoff=(--rebuild-if-same-cutoff)
              fi
              python tools/market_snapshot.py update \
                --previous "$PREVIOUS_SNAPSHOT/snapshot.tar.gz" \
                --output "$candidate" \
                --source-commit "$SOURCE_SHA" \
                --cache "$RUNNER_TEMP/market-snapshot-cache" \
                --require-history-cache \
                "${rebuild_same_cutoff[@]}"
              if [[ ! -f "$candidate/manifest.json" ]]; then
                if [[ -e "$candidate" ]]; then
                  echo "同一日期 no-op 不得留下未完成的新快照目錄。" >&2
                  exit 1
                fi
                if [[ "$SNAPSHOT_STRATEGY" != "refresh" ]]; then
                  echo "資料程式已改變，但重建沒有產生候選 snapshot。" >&2
                  exit 1
                fi
                echo "同一日期官方資料已存在，排程正常結束且不部署。"
                {
                  echo "should_deploy=false"
                  echo "candidate_artifact_name="
                  echo "snapshot_artifact_name="
                  echo "snapshot_strategy=refresh"
                  echo "market_data_source_sha=$MARKET_DATA_SOURCE_SHA"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
              effective_market_data_source_sha="$SOURCE_SHA"
            else
              echo "未知 snapshot 策略：$SNAPSHOT_STRATEGY" >&2
              exit 1
            fi
          else
            echo "找不到可用市場快照；請先執行 bootstrap-market-history.yml 的手動十年基準 workflow。" >&2
            exit 1
          fi

          python tools/market_snapshot.py validate --snapshot "$candidate"
          PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools" python - \
            "$candidate/manifest.json" \
            "$candidate/deployment.json" \
            "$SOURCE_SHA" \
            "$effective_market_data_source_sha" \
            "$SNAPSHOT_STRATEGY" \
            "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          from deployment_versions import create_deployment_version, write_deployment_version

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          deployment_path = Path(sys.argv[2])
          website_source_sha = sys.argv[3]
          market_data_source_sha = sys.argv[4]
          snapshot_strategy = sys.argv[5]
          version = create_deployment_version(
              manifest,
              website_source_commit=website_source_sha,
              market_data_source_commit=market_data_source_sha,
              snapshot_strategy=snapshot_strategy,
          )
          write_deployment_version(deployment_path, version)
          cutoff = version.cutoff_date
          artifact_name = f"market-snapshot-{cutoff}-{market_data_source_sha[:12]}"
          candidate_name = f"candidate-{artifact_name}-{sys.argv[6]}-{sys.argv[7]}"
          print("should_deploy=true")
          print(f"candidate_artifact_name={candidate_name}")
          print(f"snapshot_artifact_name={artifact_name}")
          print(f"snapshot_strategy={snapshot_strategy}")
          print(f"market_data_source_sha={market_data_source_sha}")
          PY
          {
            echo "### 部署版本"
            echo "- 網站程式版本：\`$SOURCE_SHA\`"
            echo "- 市場資料版本：\`$effective_market_data_source_sha\`"
            echo "- Snapshot 策略：\`$SNAPSHOT_STRATEGY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified candidate snapshot for this deployment
        if: ${{ steps.make-snapshot.outputs.should_deploy == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.make-snapshot.outputs.candidate_artifact_name }}
          path: |
            ${{ runner.temp }}/candidate-snapshot/snapshot.tar.gz
            ${{ runner.temp }}/candidate-snapshot/manifest.json
            ${{ runner.temp }}/candidate-snapshot/provenance.json
            ${{ runner.temp }}/candidate-snapshot/SHA256SUMS
            ${{ runner.temp }}/candidate-snapshot/deployment.json
          if-no-files-found: error
          retention-days: 1

      - name: Save resumable ten-year market history cache
        if: ${{ always() && steps.restore-history-cache.outcome == 'success' && needs.resolve-source.outputs.mode == 'update' && steps.snapshot-plan.outputs.snapshot_strategy != 'reuse' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

  build-pages:
    name: 以已驗證快照建置 Pages
    needs:
      - resolve-source
      - source-snapshot
    if: ${{ needs.source-snapshot.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Download this deployment's candidate snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.source-snapshot.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate-snapshot-artifact

      - id: restore-candidate
        name: Restore and validate candidate snapshot
        env:
          MARKET_DATA_SOURCE_SHA: ${{ needs.source-snapshot.outputs.market_data_source_sha }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/candidate-snapshot-artifact"
          mapfile -t artifact_files < <(find "$artifact_root" -type f -print)
          if [[ "$(printf '%s\n' "${artifact_files[@]##*/}" | sort)" != $'SHA256SUMS\ndeployment.json\nmanifest.json\nprovenance.json\nsnapshot.tar.gz' ]]; then
            echo "候選 snapshot artifact 必須恰含四個快照檔案與 deployment.json。" >&2
            exit 1
          fi
          for required in SHA256SUMS manifest.json provenance.json snapshot.tar.gz; do
            mapfile -t matches < <(find "$artifact_root" -type f -name "$required" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "候選 snapshot artifact 的 $required 不可缺漏或重複。" >&2
              exit 1
            fi
            declare "artifact_${required//./_}=${matches[0]}"
          done
          mapfile -t deployment_matches < <(find "$artifact_root" -type f -name deployment.json -print)
          if [[ "${#deployment_matches[@]}" -ne 1 ]]; then
            echo "候選 snapshot artifact 的 deployment.json 不可缺漏或重複。" >&2
            exit 1
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools:$GITHUB_WORKSPACE/tools" python - \
            "$artifact_snapshot_tar_gz" \
            "$artifact_manifest_json" \
            "$artifact_provenance_json" \
            "$artifact_SHA256SUMS" \
            "${deployment_matches[0]}" \
            "$RUNNER_TEMP/verified-candidate-snapshot" \
            "$SOURCE_SHA" \
            "$MARKET_DATA_SOURCE_SHA" <<'PY'
          from pathlib import Path
          from shutil import copy2, copytree
          import sys

          from deployment_versions import load_deployment_version
          from market_snapshot import _extract_previous_snapshot_archive, validate_snapshot

          archive = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          provenance_path = Path(sys.argv[3])
          sums_path = Path(sys.argv[4])
          deployment_path = Path(sys.argv[5])
          destination = Path(sys.argv[6])
          website_source_sha = sys.argv[7]
          market_data_source_sha = sys.argv[8]
          if destination.exists():
              raise SystemExit("候選快照還原目錄已存在，拒絕混入舊檔案。")
          extracted = _extract_previous_snapshot_archive(archive)
          for name, external_path in {
              "manifest.json": manifest_path,
              "provenance.json": provenance_path,
              "SHA256SUMS": sums_path,
              "snapshot.tar.gz": archive,
          }.items():
              if external_path.read_bytes() != (extracted / name).read_bytes():
                  raise SystemExit(f"候選 snapshot artifact 的 {name} 與 archive 內容不一致。")
          copytree(extracted, destination)
          manifest = validate_snapshot(destination)
          deployment = load_deployment_version(manifest_path, deployment_path)
          if manifest.source_commit != market_data_source_sha:
              raise SystemExit("候選快照的 sourceCommit 與市場資料版本不一致。")
          if deployment.website_source_commit != website_source_sha:
              raise SystemExit("候選快照的網站程式版本不一致。")
          if deployment.market_data_source_commit != market_data_source_sha:
              raise SystemExit("候選快照的市場資料版本 metadata 不一致。")
          if deployment.snapshot_hash != manifest.snapshot_hash:
              raise SystemExit("候選快照的 deployment metadata 未綁定 snapshotHash。")
          copy2(deployment_path, destination / "deployment.json")
          PY
          echo "snapshot=$RUNNER_TEMP/verified-candidate-snapshot" >> "$GITHUB_OUTPUT"

      - name: Copy only verified market data into the static build input
        env:
          VERIFIED_SNAPSHOT: ${{ steps.restore-candidate.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d public/data ]] && [[ -n "$(find public/data -mindepth 1 -print -quit)" ]]; then
            echo "public/data 必須在部署前是空的，避免混入未驗證資料。" >&2
            exit 1
          fi
          mkdir -p public/data
          cp -a "$VERIFIED_SNAPSHOT/data/." public/data/
          cp "$VERIFIED_SNAPSHOT/manifest.json" public/data/manifest.json
          cp "$VERIFIED_SNAPSHOT/provenance.json" public/data/provenance.json
          cp "$VERIFIED_SNAPSHOT/deployment.json" public/deployment-version.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build one static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Confirm rendered data is exactly the verified snapshot
        env:
          VERIFIED_SNAPSHOT: ${{ steps.restore-candidate.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$VERIFIED_SNAPSHOT" "$GITHUB_WORKSPACE/.vitepress/dist" <<'PY'
          from pathlib import Path
          import sys

          snapshot_root = Path(sys.argv[1])
          rendered_data = Path(sys.argv[2]) / "data"
          if not rendered_data.is_dir():
              raise SystemExit("Pages build 缺少已驗證市場資料。")

          def files(root: Path) -> dict[str, bytes]:
              return {
                  path.relative_to(root).as_posix(): path.read_bytes()
                  for path in root.rglob("*")
                  if path.is_file()
              }

          expected = files(snapshot_root / "data")
          for name in ("manifest.json", "provenance.json"):
              expected[name] = (snapshot_root / name).read_bytes()

          if expected != files(rendered_data):
              raise SystemExit("Pages build 的市場資料不是已驗證 snapshot 的精確副本。")
          deployment_version = Path(sys.argv[2]) / "deployment-version.json"
          if (
              not deployment_version.is_file()
              or deployment_version.read_bytes() != (snapshot_root / "deployment.json").read_bytes()
          ):
              raise SystemExit("Pages build 缺少正確的網站／市場資料版本 metadata。")
          PY

      - name: Fail closed when the Pages artifact reaches 400 MiB
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/.vitepress/dist" <<'PY'
          from pathlib import Path
          import sys

          artifact = Path(sys.argv[1])
          size = sum(path.stat().st_size for path in artifact.rglob("*") if path.is_file())
          limit = 400 * 1024 * 1024
          if size >= limit:
              raise SystemExit(
                  f"GitHub Pages artifact 為 {size} bytes，已達 400 MiB 發布門檻；拒絕上傳。"
              )
          PY

      - name: Upload one GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .vitepress/dist

  deploy:
    name: 部署單一 Pages artifact
    needs:
      - source-snapshot
      - build-pages
    if: ${{ needs.build-pages.result == 'success' && needs.source-snapshot.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  publish-successful-snapshot:
    name: 保留可 rollback 的成功快照
    needs:
      - deploy
      - resolve-source
      - source-snapshot
    if: ${{ needs.deploy.result == 'success' && needs.source-snapshot.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout locked source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm immutable source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - name: Download the deployed candidate snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.source-snapshot.outputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/deployed-candidate-artifact

      - id: restore-deployed
        name: Verify snapshot before retaining it for rollback
        env:
          MARKET_DATA_SOURCE_SHA: ${{ needs.source-snapshot.outputs.market_data_source_sha }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/deployed-candidate-artifact"
          mapfile -t artifact_files < <(find "$artifact_root" -type f -print)
          if [[ "$(printf '%s\n' "${artifact_files[@]##*/}" | sort)" != $'SHA256SUMS\ndeployment.json\nmanifest.json\nprovenance.json\nsnapshot.tar.gz' ]]; then
            echo "已部署候選 artifact 必須恰含四個快照檔案與 deployment.json。" >&2
            exit 1
          fi
          for required in SHA256SUMS manifest.json provenance.json snapshot.tar.gz; do
            mapfile -t matches < <(find "$artifact_root" -type f -name "$required" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "已部署候選 artifact 的 $required 不可缺漏或重複。" >&2
              exit 1
            fi
            declare "artifact_${required//./_}=${matches[0]}"
          done
          mapfile -t deployment_matches < <(find "$artifact_root" -type f -name deployment.json -print)
          if [[ "${#deployment_matches[@]}" -ne 1 ]]; then
            echo "已部署候選 artifact 的 deployment.json 不可缺漏或重複。" >&2
            exit 1
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools:$GITHUB_WORKSPACE/tools" python - \
            "$artifact_snapshot_tar_gz" \
            "$artifact_manifest_json" \
            "$artifact_provenance_json" \
            "$artifact_SHA256SUMS" \
            "${deployment_matches[0]}" \
            "$RUNNER_TEMP/deployed-verified-snapshot" \
            "$SOURCE_SHA" \
            "$MARKET_DATA_SOURCE_SHA" <<'PY'
          from pathlib import Path
          from shutil import copy2, copytree
          import sys

          from deployment_versions import load_deployment_version
          from market_snapshot import _extract_previous_snapshot_archive, validate_snapshot

          archive = Path(sys.argv[1])
          manifest_path = Path(sys.argv[2])
          provenance_path = Path(sys.argv[3])
          sums_path = Path(sys.argv[4])
          deployment_path = Path(sys.argv[5])
          destination = Path(sys.argv[6])
          website_source_sha = sys.argv[7]
          market_data_source_sha = sys.argv[8]
          if destination.exists():
              raise SystemExit("成功快照還原目錄已存在，拒絕混入舊檔案。")
          extracted = _extract_previous_snapshot_archive(archive)
          for name, external_path in {
              "manifest.json": manifest_path,
              "provenance.json": provenance_path,
              "SHA256SUMS": sums_path,
              "snapshot.tar.gz": archive,
          }.items():
              if external_path.read_bytes() != (extracted / name).read_bytes():
                  raise SystemExit(f"已部署 snapshot artifact 的 {name} 與 archive 內容不一致。")
          copytree(extracted, destination)
          manifest = validate_snapshot(destination)
          deployment = load_deployment_version(manifest_path, deployment_path)
          if manifest.source_commit != market_data_source_sha:
              raise SystemExit("已部署快照的 sourceCommit 與市場資料版本不一致。")
          if deployment.website_source_commit != website_source_sha:
              raise SystemExit("已部署快照的網站程式版本不一致。")
          if deployment.market_data_source_commit != market_data_source_sha:
              raise SystemExit("已部署快照的市場資料版本 metadata 不一致。")
          if deployment.snapshot_hash != manifest.snapshot_hash:
              raise SystemExit("已部署快照的 deployment metadata 未綁定 snapshotHash。")
          copy2(deployment_path, destination / "deployment.json")
          PY
          echo "snapshot=$RUNNER_TEMP/deployed-verified-snapshot" >> "$GITHUB_OUTPUT"

      - name: Upload 30-day successful snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.source-snapshot.outputs.snapshot_artifact_name }}
          path: |
            ${{ steps.restore-deployed.outputs.snapshot }}/snapshot.tar.gz
            ${{ steps.restore-deployed.outputs.snapshot }}/manifest.json
            ${{ steps.restore-deployed.outputs.snapshot }}/provenance.json
            ${{ steps.restore-deployed.outputs.snapshot }}/SHA256SUMS
            ${{ steps.restore-deployed.outputs.snapshot }}/deployment.json
          if-no-files-found: error
          retention-days: 30
