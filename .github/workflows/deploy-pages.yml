name: 原子化 GitHub Pages 部署

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      source_sha:
        description: 要部署的不可變完整 Git commit SHA。
        required: true
        type: string
      rollback_artifact_id:
        description: 成功 deployment-record Artifact ID；提供時忽略 source_sha。
        required: false
        default: ""
        type: string
      skip_if_same_cutoff:
        description: 僅排程使用；官方資料日期未變時成功 no-op 而不部署。
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      source_sha:
        description: 正常部署時要使用的完整 Git commit SHA；留空使用觸發 commit。
        required: false
        default: ""
        type: string
      rollback_artifact_id:
        description: 成功 deployment-record Artifact ID；提供時忽略 source_sha。
        required: false
        default: ""
        type: string
      skip_if_same_cutoff:
        description: 官方資料日期相同時不建立新部署；日常手動部署請保留 false。
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  resolve-source:
    name: 鎖定網站版本與 rollback 配對
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      rollback_market_artifact_id: ${{ steps.resolve.outputs.rollback_market_artifact_id }}
      rollback_market_artifact_digest: ${{ steps.resolve.outputs.rollback_market_artifact_digest }}
      workflow_started_epoch: ${{ steps.workflow-clock.outputs.workflow_started_epoch }}
    steps:
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - id: workflow-clock
        name: Record the immutable workflow start time
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          created_at="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          echo "workflow_started_epoch=$(date --date="$created_at" +%s)" >> "$GITHUB_OUTPUT"

      - id: deployment-record
        name: Validate and download the selected deployment record
        if: ${{ inputs.rollback_artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_ID: ${{ inputs.rollback_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RECORD_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "rollback_artifact_id 必須是正整數 deployment-record Artifact ID。" >&2
            exit 1
          fi
          python .workflow-helper/tools/github_actions_artifacts.py \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --deployment-record-id "$RECORD_ID" > "$RUNNER_TEMP/deployment-record-provenance.env"
          cat "$RUNNER_TEMP/deployment-record-provenance.env" >> "$GITHUB_OUTPUT"
          artifact_digest="$(sed -n 's/^artifact_digest=//p' "$RUNNER_TEMP/deployment-record-provenance.env")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECORD_ID/zip" > "$RUNNER_TEMP/deployment-record.zip"
          python .workflow-helper/tools/market_artifact_archive.py \
            --archive "$RUNNER_TEMP/deployment-record.zip" \
            --expected-digest "$artifact_digest" \
            --destination "$RUNNER_TEMP/deployment-record" \
            --allow-kind deployment-record-v2

      - id: resolve
        name: Resolve immutable source and market Artifact
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          RECORD_ID: ${{ inputs.rollback_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "正式 Pages 部署只能由 main branch workflow 執行。" >&2
            exit 1
          fi
          if [[ -n "$RECORD_ID" ]]; then
            PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools" python - \
              "$RUNNER_TEMP/deployment-record/deployment.json" <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from pathlib import Path
          from deployment_versions import load_deployment_record

          version = load_deployment_record(Path(sys.argv[1]))
          print(f"source_sha={version.website_source_commit}")
          print("mode=rollback")
          print(f"rollback_market_artifact_id={version.market_artifact_id}")
          print(f"rollback_market_artifact_digest={version.market_artifact_digest}")
          PY
          else
            if ! [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source SHA 必須是完整的小寫 Git commit SHA。" >&2
              exit 1
            fi
            if [[ "$REQUESTED_SOURCE_SHA" != "$WORKFLOW_SOURCE_SHA" ]]; then
              echo "正常部署只能使用本次 main workflow 的 source SHA；歷史版本請使用 deployment record rollback。" >&2
              exit 1
            fi
            {
              echo "source_sha=$REQUESTED_SOURCE_SHA"
              echo "mode=update"
              echo "rollback_market_artifact_id="
              echo "rollback_market_artifact_digest="
            } >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: 驗證鎖定的網站 source
    needs: resolve-source
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ needs.resolve-source.outputs.source_sha }}

  source-snapshot:
    name: 選取、重建或重用簽署市場快照
    needs:
      - resolve-source
      - verify
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      should_deploy: ${{ steps.finalize.outputs.should_deploy }}
      snapshot_strategy: ${{ steps.finalize.outputs.snapshot_strategy }}
      market_artifact_id: ${{ steps.finalize.outputs.market_artifact_id }}
      market_artifact_digest: ${{ steps.finalize.outputs.market_artifact_digest }}
      market_artifact_run_id: ${{ steps.finalize.outputs.market_artifact_run_id }}
      market_artifact_source_sha: ${{ steps.finalize.outputs.market_artifact_source_sha }}
      market_artifact_workflow_path: ${{ steps.finalize.outputs.market_artifact_workflow_path }}
      market_artifact_signer_workflow_path: ${{ steps.finalize.outputs.market_artifact_signer_workflow_path }}
      snapshot_hash: ${{ steps.finalize.outputs.snapshot_hash }}
      cutoff_date: ${{ steps.finalize.outputs.cutoff_date }}
      market_data_source_sha: ${{ steps.finalize.outputs.market_data_source_sha }}
      receipt_version: ${{ steps.finalize.outputs.receipt_version }}
      snapshot_reason: ${{ steps.finalize.outputs.snapshot_reason }}
      validator_contract_digest: ${{ steps.finalize.outputs.validator_contract_digest }}
      artifact_find_seconds: ${{ steps.select-market-artifact.outputs.artifact_find_seconds }}
      artifact_download_seconds: ${{ steps.unpack-market-artifact.outputs.artifact_download_seconds }}
      archive_verify_seconds: ${{ steps.unpack-market-artifact.outputs.archive_verify_seconds }}
      fast_verify_seconds: ${{ steps.verify-signed-market.outputs.fast_verify_seconds }}
      full_validator_count: ${{ steps.rebuild-snapshot.outputs.full_validator_count }}
      full_validator_seconds: ${{ steps.rebuild-snapshot.outputs.full_validator_seconds }}
    steps:
      - name: Checkout locked website source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Confirm immutable website source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi
          if [[ "$DEPLOY_MODE" == "update" ]]; then
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/main; then
              echo "正常部署 source SHA 已不在 main 歷史，拒絕部署。" >&2
              exit 1
            fi
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - id: select-market-artifact
        name: Select one immutable market Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
          ROLLBACK_ID: ${{ needs.resolve-source.outputs.rollback_market_artifact_id }}
          ROLLBACK_DIGEST: ${{ needs.resolve-source.outputs.rollback_market_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          provenance="$RUNNER_TEMP/market-artifact-provenance.env"
          if [[ "$DEPLOY_MODE" == "rollback" ]]; then
            python .workflow-helper/tools/github_actions_artifacts.py \
              --api-url "$GITHUB_API_URL" \
              --repository "$GITHUB_REPOSITORY" \
              --artifact-id "$ROLLBACK_ID" \
              --artifact-digest "$ROLLBACK_DIGEST" > "$provenance"
          else
            python .workflow-helper/tools/github_actions_artifacts.py \
              --api-url "$GITHUB_API_URL" \
              --repository "$GITHUB_REPOSITORY" \
              --max-pages 10 > "$provenance"
          fi
          cat "$provenance" >> "$GITHUB_OUTPUT"
          echo "artifact_find_seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"

      - name: Require a previous market baseline
        env:
          ARTIFACT_ID: ${{ steps.select-market-artifact.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "找不到可用市場快照；請先執行 bootstrap-market-history.yml。" >&2
            exit 1
          fi

      - id: unpack-market-artifact
        name: Download Artifact ZIP and verify its exact digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.select-market-artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.select-market-artifact.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          download_started="$(date +%s)"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/market-artifact.zip"
          download_finished="$(date +%s)"
          result="$(python .workflow-helper/tools/market_artifact_archive.py \
            --archive "$RUNNER_TEMP/market-artifact.zip" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --destination "$RUNNER_TEMP/market-artifact" \
            --allow-kind signed-market-v1)"
          python - "$result" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          result = json.loads(sys.argv[1])
          print(f"artifact_kind={result['artifact_kind']}")
          PY
          echo "artifact_download_seconds=$((download_finished - download_started))" >> "$GITHUB_OUTPUT"
          echo "archive_verify_seconds=$(($(date +%s) - download_finished))" >> "$GITHUB_OUTPUT"

      - name: Checkout the market Artifact contract source
        if: ${{ steps.unpack-market-artifact.outputs.artifact_kind == 'signed-market-v1' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.select-market-artifact.outputs.artifact_source_sha }}
          path: .market-contract
          fetch-depth: 1

      - id: verify-signed-market
        name: Verify Attestation, predicate and validation receipt
        if: ${{ steps.unpack-market-artifact.outputs.artifact_kind == 'signed-market-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SOURCE_SHA: ${{ steps.select-market-artifact.outputs.artifact_source_sha }}
          MARKET_SIGNER_WORKFLOW_PATH: ${{ steps.select-market-artifact.outputs.artifact_signer_workflow_path }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          gh attestation verify "$RUNNER_TEMP/market-artifact/snapshot.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$MARKET_SIGNER_WORKFLOW_PATH" \
            --source-ref refs/heads/main \
            --source-digest "$MARKET_SOURCE_SHA" \
            --predicate-type https://eric861129.github.io/attestations/market-snapshot-validation/v1 \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/market-attestation.json"
          python .workflow-helper/tools/market_snapshot_attestation.py verify-receipt-predicate \
            --attestation-json "$RUNNER_TEMP/market-attestation.json" \
            --receipt "$RUNNER_TEMP/market-artifact/validation-receipt.json"
          python .workflow-helper/tools/market_snapshot_receipt.py verify \
            --artifact-dir "$RUNNER_TEMP/market-artifact" \
            --repository-root "$GITHUB_WORKSPACE/.market-contract" \
            --extract-to "$RUNNER_TEMP/previous-snapshot" > "$RUNNER_TEMP/verified-receipt.json"
          python - "$RUNNER_TEMP/verified-receipt.json" "$MARKET_SOURCE_SHA" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result["market_source_sha"] != sys.argv[2]:
              raise SystemExit("Artifact source SHA 與 validation receipt 不一致。")
          print(f"snapshot_hash={result['snapshot_hash']}")
          print(f"cutoff_date={result['cutoff_date']}")
          print(f"market_data_source_sha={result['market_source_sha']}")
          print(f"receipt_version={result['receipt_version']}")
          print(f"validator_contract_digest={result['validator_contract_digest']}")
          PY
          echo "fast_verify_seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"

      - id: snapshot-plan
        name: Separate website and market data versions
        env:
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
          ARTIFACT_KIND: ${{ steps.unpack-market-artifact.outputs.artifact_kind }}
          MARKET_SOURCE_SHA: ${{ steps.verify-signed-market.outputs.market_data_source_sha }}
          WEBSITE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          SKIP_IF_SAME_CUTOFF: ${{ inputs.skip_if_same_cutoff || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_MODE" == "rollback" ]]; then
            echo "snapshot_strategy=snapshot-reuse" >> "$GITHUB_OUTPUT"
            echo "snapshot_reason=verified-rollback-record" >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP_IF_SAME_CUTOFF" == "true" ]]; then
            echo "snapshot_strategy=snapshot-rebuild" >> "$GITHUB_OUTPUT"
            echo "snapshot_reason=scheduled-market-refresh" >> "$GITHUB_OUTPUT"
          else
            python .workflow-helper/tools/deployment_snapshot_mode.py \
              --repository "$GITHUB_WORKSPACE" \
              --market-data-source-sha "$MARKET_SOURCE_SHA" \
              --website-source-sha "$WEBSITE_SOURCE_SHA" > "$RUNNER_TEMP/snapshot-plan.env"
            mode="$(sed -n 's/^snapshot_strategy=//p' "$RUNNER_TEMP/snapshot-plan.env")"
            reason="$(sed -n 's/^snapshot_reason=//p' "$RUNNER_TEMP/snapshot-plan.env")"
            if [[ -z "$reason" ]]; then
              echo "Snapshot 分類器沒有輸出原因。" >&2
              exit 1
            fi
            if [[ "$mode" == "reuse" ]]; then
              echo "snapshot_strategy=snapshot-reuse" >> "$GITHUB_OUTPUT"
            elif [[ "$mode" == "rebuild" ]]; then
              echo "snapshot_strategy=snapshot-rebuild" >> "$GITHUB_OUTPUT"
            else
              echo "未知 snapshot 策略：$mode" >&2
              exit 1
            fi
            echo "snapshot_reason=$reason" >> "$GITHUB_OUTPUT"
          fi

      - id: restore-history-cache
        name: Restore resumable ten-year market history cache
        if: ${{ steps.snapshot-plan.outputs.snapshot_strategy == 'snapshot-rebuild' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-history-v1-${{ github.repository_id }}-

      - name: Prepare market history cache directory
        if: ${{ steps.snapshot-plan.outputs.snapshot_strategy == 'snapshot-rebuild' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/market-snapshot-cache"

      - id: rebuild-snapshot
        name: Rebuild and fully validate market snapshot once
        if: ${{ steps.snapshot-plan.outputs.snapshot_strategy == 'snapshot-rebuild' }}
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          SKIP_IF_SAME_CUTOFF: ${{ inputs.skip_if_same_cutoff || false }}
          MARKET_VALIDATOR_TIMING_OUTPUT: ${{ runner.temp }}/market-validator-timing.json
        shell: bash
        run: |
          set -euo pipefail
          rebuild_same_cutoff=(--rebuild-if-same-cutoff)
          if [[ "$SKIP_IF_SAME_CUTOFF" == "true" ]]; then
            rebuild_same_cutoff=()
          fi
          python tools/market_snapshot.py update \
            --verified-previous-manifest "$RUNNER_TEMP/previous-snapshot/manifest.json" \
            --output "$RUNNER_TEMP/rebuilt-snapshot" \
            --source-commit "$SOURCE_SHA" \
            --cache "$RUNNER_TEMP/market-snapshot-cache" \
            --require-history-cache \
            "${rebuild_same_cutoff[@]}"
          if [[ ! -f "$RUNNER_TEMP/rebuilt-snapshot/manifest.json" ]]; then
            if [[ -e "$RUNNER_TEMP/rebuilt-snapshot" || "$SKIP_IF_SAME_CUTOFF" != "true" ]]; then
              echo "市場資料重建未產生完整快照。" >&2
              exit 1
            fi
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python tools/market_snapshot_receipt.py create \
            --archive "$RUNNER_TEMP/rebuilt-snapshot/snapshot.tar.gz" \
            --output "$RUNNER_TEMP/rebuilt-snapshot/validation-receipt.json" \
            --market-source-commit "$SOURCE_SHA" \
            --validator-source-commit "$SOURCE_SHA" \
            --repository-root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/rebuilt-receipt.json"
          python - "$RUNNER_TEMP/rebuilt-receipt.json" "$MARKET_VALIDATOR_TIMING_OUTPUT" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          timing = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if timing.get("fullValidatorCount") != 1:
              raise SystemExit("候選快照完整 validator 次數不是 1。")
          print("should_deploy=true")
          print(f"snapshot_hash={result['snapshot_hash']}")
          print(f"cutoff_date={result['cutoff_date']}")
          print(f"market_data_source_sha={result['market_source_sha']}")
          print(f"receipt_version={result['receipt_version']}")
          print(f"validator_contract_digest={result['validator_contract_digest']}")
          print("full_validator_count=1")
          print(f"full_validator_seconds={timing['fullValidatorSeconds']}")
          PY

      - id: attest-market-snapshot
        name: Attest the newly validated market snapshot
        if: ${{ steps.rebuild-snapshot.outputs.should_deploy == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/rebuilt-snapshot/snapshot.tar.gz
          predicate-type: https://eric861129.github.io/attestations/market-snapshot-validation/v1
          predicate-path: ${{ runner.temp }}/rebuilt-snapshot/validation-receipt.json
          create-storage-record: false

      - id: upload-market-snapshot
        name: Upload immutable three-file market Artifact
        if: ${{ steps.rebuild-snapshot.outputs.should_deploy == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: market-snapshot-${{ steps.rebuild-snapshot.outputs.snapshot_hash }}
          path: |
            ${{ runner.temp }}/rebuilt-snapshot/snapshot.tar.gz
            ${{ runner.temp }}/rebuilt-snapshot/snapshot.tar.gz.sha256
            ${{ runner.temp }}/rebuilt-snapshot/validation-receipt.json
          if-no-files-found: error
          retention-days: 30

      - id: finalize
        name: Publish the selected immutable snapshot identity
        env:
          STRATEGY: ${{ steps.snapshot-plan.outputs.snapshot_strategy }}
          REBUILD_DEPLOY: ${{ steps.rebuild-snapshot.outputs.should_deploy }}
          UPLOAD_ID: ${{ steps.upload-market-snapshot.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.upload-market-snapshot.outputs.artifact-digest }}
          REUSE_ARTIFACT_ID: ${{ steps.select-market-artifact.outputs.artifact_id }}
          REUSE_ARTIFACT_DIGEST: ${{ steps.select-market-artifact.outputs.artifact_digest }}
          REUSE_ARTIFACT_RUN_ID: ${{ steps.select-market-artifact.outputs.artifact_run_id }}
          REUSE_ARTIFACT_SOURCE_SHA: ${{ steps.select-market-artifact.outputs.artifact_source_sha }}
          REUSE_ARTIFACT_WORKFLOW_PATH: ${{ steps.select-market-artifact.outputs.artifact_workflow_path }}
          REUSE_ARTIFACT_SIGNER_WORKFLOW_PATH: ${{ steps.select-market-artifact.outputs.artifact_signer_workflow_path }}
          REUSE_SNAPSHOT_HASH: ${{ steps.verify-signed-market.outputs.snapshot_hash }}
          REUSE_CUTOFF_DATE: ${{ steps.verify-signed-market.outputs.cutoff_date }}
          REUSE_MARKET_SOURCE_SHA: ${{ steps.verify-signed-market.outputs.market_data_source_sha }}
          REUSE_RECEIPT_VERSION: ${{ steps.verify-signed-market.outputs.receipt_version }}
          REBUILD_SNAPSHOT_HASH: ${{ steps.rebuild-snapshot.outputs.snapshot_hash }}
          REBUILD_CUTOFF_DATE: ${{ steps.rebuild-snapshot.outputs.cutoff_date }}
          REBUILD_MARKET_SOURCE_SHA: ${{ steps.rebuild-snapshot.outputs.market_data_source_sha }}
          REBUILD_RECEIPT_VERSION: ${{ steps.rebuild-snapshot.outputs.receipt_version }}
          REUSE_VALIDATOR_CONTRACT_DIGEST: ${{ steps.verify-signed-market.outputs.validator_contract_digest }}
          REBUILD_VALIDATOR_CONTRACT_DIGEST: ${{ steps.rebuild-snapshot.outputs.validator_contract_digest }}
          SNAPSHOT_REASON: ${{ steps.snapshot-plan.outputs.snapshot_reason }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STRATEGY" == "snapshot-reuse" ]]; then
            {
              echo "should_deploy=true"
              echo "snapshot_strategy=snapshot-reuse"
              echo "market_artifact_id=$REUSE_ARTIFACT_ID"
              echo "market_artifact_digest=$REUSE_ARTIFACT_DIGEST"
              echo "market_artifact_run_id=$REUSE_ARTIFACT_RUN_ID"
              echo "market_artifact_source_sha=$REUSE_ARTIFACT_SOURCE_SHA"
              echo "market_artifact_workflow_path=$REUSE_ARTIFACT_WORKFLOW_PATH"
              echo "market_artifact_signer_workflow_path=$REUSE_ARTIFACT_SIGNER_WORKFLOW_PATH"
              echo "snapshot_hash=$REUSE_SNAPSHOT_HASH"
              echo "cutoff_date=$REUSE_CUTOFF_DATE"
              echo "market_data_source_sha=$REUSE_MARKET_SOURCE_SHA"
              echo "receipt_version=$REUSE_RECEIPT_VERSION"
              echo "validator_contract_digest=$REUSE_VALIDATOR_CONTRACT_DIGEST"
              echo "snapshot_reason=$SNAPSHOT_REASON"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$REBUILD_DEPLOY" == "false" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "snapshot_strategy=snapshot-rebuild" >> "$GITHUB_OUTPUT"
          elif [[ "$REBUILD_DEPLOY" == "true" ]]; then
            digest="$(python .workflow-helper/tools/market_snapshot_attestation.py normalize-artifact-digest --value "$UPLOAD_DIGEST")"
            python .workflow-helper/tools/github_actions_artifacts.py \
              --api-url "$GITHUB_API_URL" \
              --repository "$GITHUB_REPOSITORY" \
              --artifact-id "$UPLOAD_ID" \
              --artifact-digest "$digest" \
              --allow-in-progress-run-id "$GITHUB_RUN_ID" > "$RUNNER_TEMP/new-market-provenance.env"
            artifact_run_id="$(sed -n 's/^artifact_run_id=//p' "$RUNNER_TEMP/new-market-provenance.env")"
            artifact_source_sha="$(sed -n 's/^artifact_source_sha=//p' "$RUNNER_TEMP/new-market-provenance.env")"
            artifact_workflow_path="$(sed -n 's/^artifact_workflow_path=//p' "$RUNNER_TEMP/new-market-provenance.env")"
            artifact_signer_workflow_path="$(sed -n 's/^artifact_signer_workflow_path=//p' "$RUNNER_TEMP/new-market-provenance.env")"
            {
              echo "should_deploy=true"
              echo "snapshot_strategy=snapshot-rebuild"
              echo "market_artifact_id=$UPLOAD_ID"
              echo "market_artifact_digest=$digest"
              echo "market_artifact_run_id=$artifact_run_id"
              echo "market_artifact_source_sha=$artifact_source_sha"
              echo "market_artifact_workflow_path=$artifact_workflow_path"
              echo "market_artifact_signer_workflow_path=$artifact_signer_workflow_path"
              echo "snapshot_hash=$REBUILD_SNAPSHOT_HASH"
              echo "cutoff_date=$REBUILD_CUTOFF_DATE"
              echo "market_data_source_sha=$REBUILD_MARKET_SOURCE_SHA"
              echo "receipt_version=$REBUILD_RECEIPT_VERSION"
              echo "validator_contract_digest=$REBUILD_VALIDATOR_CONTRACT_DIGEST"
              echo "snapshot_reason=$SNAPSHOT_REASON"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot 流程沒有產生可發布結果。" >&2
            exit 1
          fi

      - name: Summarize separated versions
        if: ${{ steps.finalize.outputs.should_deploy == 'true' }}
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          MARKET_SOURCE_SHA: ${{ steps.finalize.outputs.market_data_source_sha }}
          SNAPSHOT_STRATEGY: ${{ steps.finalize.outputs.snapshot_strategy }}
          SNAPSHOT_REASON: ${{ steps.finalize.outputs.snapshot_reason }}
          MARKET_ARTIFACT_ID: ${{ steps.finalize.outputs.market_artifact_id }}
          MARKET_ARTIFACT_DIGEST: ${{ steps.finalize.outputs.market_artifact_digest }}
          SNAPSHOT_HASH: ${{ steps.finalize.outputs.snapshot_hash }}
          CUTOFF_DATE: ${{ steps.finalize.outputs.cutoff_date }}
          RECEIPT_VERSION: ${{ steps.finalize.outputs.receipt_version }}
          VALIDATOR_CONTRACT_DIGEST: ${{ steps.finalize.outputs.validator_contract_digest }}
          ARTIFACT_FIND_SECONDS: ${{ steps.select-market-artifact.outputs.artifact_find_seconds }}
          ARTIFACT_DOWNLOAD_SECONDS: ${{ steps.unpack-market-artifact.outputs.artifact_download_seconds }}
          ARCHIVE_VERIFY_SECONDS: ${{ steps.unpack-market-artifact.outputs.archive_verify_seconds }}
          FAST_VERIFY_SECONDS: ${{ steps.verify-signed-market.outputs.fast_verify_seconds || '0' }}
          FULL_VALIDATOR_COUNT: ${{ steps.rebuild-snapshot.outputs.full_validator_count || '0' }}
          FULL_VALIDATOR_SECONDS: ${{ steps.rebuild-snapshot.outputs.full_validator_seconds || '0' }}
        shell: bash
        run: |
          {
            echo "### 部署版本"
            echo "- 網站程式版本：\`$SOURCE_SHA\`"
            echo "- 市場資料版本：\`$MARKET_SOURCE_SHA\`"
            echo "- Snapshot 策略：\`$SNAPSHOT_STRATEGY\`"
            echo "- 分類原因：\`$SNAPSHOT_REASON\`"
            echo "- Market Artifact：\`$MARKET_ARTIFACT_ID\`"
            echo "- Artifact digest：\`$MARKET_ARTIFACT_DIGEST\`"
            echo "- Snapshot hash：\`$SNAPSHOT_HASH\`"
            echo "- Cutoff date：\`$CUTOFF_DATE\`"
            echo "- Receipt version：\`$RECEIPT_VERSION\`"
            echo "- Validator contract digest：\`$VALIDATOR_CONTRACT_DIGEST\`"
            echo "- 完整 validator 次數：\`$FULL_VALIDATOR_COUNT\`"
            echo "- Artifact 查找：\`${ARTIFACT_FIND_SECONDS}s\`"
            echo "- Artifact 下載：\`${ARTIFACT_DOWNLOAD_SECONDS}s\`"
            echo "- Archive digest／解壓快驗：\`${ARCHIVE_VERIFY_SECONDS}s\`"
            echo "- Receipt／Attestation 快驗：\`${FAST_VERIFY_SECONDS}s\`"
            echo "- 完整 validator：\`${FULL_VALIDATOR_SECONDS}s\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save resumable ten-year market history cache
        if: ${{ always() && steps.restore-history-cache.outcome == 'success' && steps.rebuild-snapshot.outcome == 'success' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/market-snapshot-cache
          key: market-history-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

  build-pages:
    name: 快驗市場 Artifact 並建置 Pages
    needs:
      - resolve-source
      - source-snapshot
    if: ${{ needs.source-snapshot.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      deployment_record_artifact_id: ${{ steps.upload-deployment-record.outputs.artifact-id }}
      deployment_record_artifact_digest: ${{ steps.upload-deployment-record.outputs.artifact-digest }}
      website_build_seconds: ${{ steps.build-pages-timed.outputs.website_build_seconds }}
    steps:
      - name: Checkout locked website source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1

      - name: Confirm immutable website source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_source_sha="$(git rev-parse HEAD)"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "source SHA checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $actual_source_sha" >&2
            exit 1
          fi

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Checkout trusted workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .workflow-helper
          fetch-depth: 1

      - id: query-market-artifact
        name: Reconfirm the exact market Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_ARTIFACT_ID: ${{ needs.source-snapshot.outputs.market_artifact_id }}
          MARKET_ARTIFACT_DIGEST: ${{ needs.source-snapshot.outputs.market_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python .workflow-helper/tools/github_actions_artifacts.py \
            --api-url "$GITHUB_API_URL" \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$MARKET_ARTIFACT_ID" \
            --artifact-digest "$MARKET_ARTIFACT_DIGEST" \
            --allow-in-progress-run-id "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download and verify exact Artifact ZIP bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.source-snapshot.outputs.market_artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.source-snapshot.outputs.market_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/market-artifact.zip"
          python .workflow-helper/tools/market_artifact_archive.py \
            --archive "$RUNNER_TEMP/market-artifact.zip" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --destination "$RUNNER_TEMP/market-artifact" \
            --allow-kind signed-market-v1

      - name: Checkout the market Artifact contract source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.query-market-artifact.outputs.artifact_source_sha }}
          path: .market-contract
          fetch-depth: 1

      - name: Verify Attestation and extract by validation receipt
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SOURCE_SHA: ${{ steps.query-market-artifact.outputs.artifact_source_sha }}
          MARKET_SIGNER_WORKFLOW_PATH: ${{ steps.query-market-artifact.outputs.artifact_signer_workflow_path }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/market-artifact/snapshot.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/$MARKET_SIGNER_WORKFLOW_PATH" \
            --source-ref refs/heads/main \
            --source-digest "$MARKET_SOURCE_SHA" \
            --predicate-type https://eric861129.github.io/attestations/market-snapshot-validation/v1 \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/market-attestation.json"
          python .workflow-helper/tools/market_snapshot_attestation.py verify-receipt-predicate \
            --attestation-json "$RUNNER_TEMP/market-attestation.json" \
            --receipt "$RUNNER_TEMP/market-artifact/validation-receipt.json"
          python .workflow-helper/tools/market_snapshot_receipt.py verify \
            --artifact-dir "$RUNNER_TEMP/market-artifact" \
            --repository-root "$GITHUB_WORKSPACE/.market-contract" \
            --extract-to "$RUNNER_TEMP/verified-snapshot" > "$RUNNER_TEMP/verified-receipt.json"

      - id: create-deployment-record
        name: Bind deploymentVersion 2 to the immutable market Artifact
        env:
          WEBSITE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          MARKET_SOURCE_SHA: ${{ needs.source-snapshot.outputs.market_data_source_sha }}
          MARKET_ARTIFACT_ID: ${{ needs.source-snapshot.outputs.market_artifact_id }}
          MARKET_ARTIFACT_DIGEST: ${{ needs.source-snapshot.outputs.market_artifact_digest }}
          SNAPSHOT_STRATEGY: ${{ needs.source-snapshot.outputs.snapshot_strategy }}
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
          ROLLBACK_SOURCE_RECORD_ID: ${{ inputs.rollback_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deployment-record"
          PYTHONPATH="$GITHUB_WORKSPACE/.workflow-helper/tools" python - \
            "$RUNNER_TEMP/verified-snapshot/manifest.json" \
            "$RUNNER_TEMP/deployment-record/deployment.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from deployment_versions import create_deployment_version, write_deployment_version

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          version = create_deployment_version(
              manifest,
              website_source_commit=os.environ["WEBSITE_SOURCE_SHA"],
              market_data_source_commit=os.environ["MARKET_SOURCE_SHA"],
              market_artifact_id=int(os.environ["MARKET_ARTIFACT_ID"]),
              market_artifact_digest=os.environ["MARKET_ARTIFACT_DIGEST"],
              strategy=os.environ["SNAPSHOT_STRATEGY"],
              rollback_source_deployment_record_id=(
                  int(os.environ["ROLLBACK_SOURCE_RECORD_ID"])
                  if os.environ["DEPLOY_MODE"] == "rollback"
                  else None
              ),
          )
          if version.deployment_version != 2:
              raise SystemExit("deploymentVersion 必須是 2。")
          write_deployment_version(Path(sys.argv[2]), version)
          PY
          python .workflow-helper/tools/market_snapshot_receipt.py verify \
            --artifact-dir "$RUNNER_TEMP/market-artifact" \
            --repository-root "$GITHUB_WORKSPACE/.market-contract" \
            --deployment-metadata "$RUNNER_TEMP/deployment-record/deployment.json" > /dev/null

      - name: Copy only receipt-verified market data into the static build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d public/data ]] && [[ -n "$(find public/data -mindepth 1 -print -quit)" ]]; then
            echo "public/data 必須是空目錄，避免混入未驗證資料。" >&2
            exit 1
          fi
          mkdir -p public/data
          cp -a "$RUNNER_TEMP/verified-snapshot/data/." public/data/
          cp "$RUNNER_TEMP/verified-snapshot/manifest.json" public/data/manifest.json
          cp "$RUNNER_TEMP/verified-snapshot/provenance.json" public/data/provenance.json
          cp "$RUNNER_TEMP/deployment-record/deployment.json" public/deployment-version.json

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - id: build-pages-timed
        name: Build one static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          started="$(date +%s)"
          npm ci
          npm run build
          echo "website_build_seconds=$(($(date +%s) - started))" >> "$GITHUB_OUTPUT"

      - name: Confirm rendered data is an exact verified copy
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/verified-snapshot" "$GITHUB_WORKSPACE/.vitepress/dist" "$RUNNER_TEMP/deployment-record/deployment.json" <<'PY'
          from pathlib import Path
          import sys

          snapshot_root = Path(sys.argv[1])
          dist = Path(sys.argv[2])
          deployment = Path(sys.argv[3])

          def files(root: Path) -> dict[str, bytes]:
              return {
                  path.relative_to(root).as_posix(): path.read_bytes()
                  for path in root.rglob("*")
                  if path.is_file()
              }

          expected = files(snapshot_root / "data")
          for name in ("manifest.json", "provenance.json"):
              expected[name] = (snapshot_root / name).read_bytes()
          if expected != files(dist / "data"):
              raise SystemExit("Pages build 的市場資料不是 validation receipt 快照的精確副本。")
          if (dist / "deployment-version.json").read_bytes() != deployment.read_bytes():
              raise SystemExit("Pages build 的 deployment metadata 不一致。")
          PY

      - name: Fail closed when the Pages artifact reaches 400 MiB
        shell: bash
        run: |
          set -euo pipefail
          python - "$GITHUB_WORKSPACE/.vitepress/dist" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          size = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          if size >= 400 * 1024 * 1024:
              raise SystemExit(f"GitHub Pages artifact 為 {size} bytes，已達 400 MiB 門檻。")
          PY

      - id: upload-deployment-record
        name: Upload immutable deployment record for future rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-record-${{ needs.resolve-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-record/deployment.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload one GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .vitepress/dist

  deploy:
    name: 部署單一 Pages artifact
    needs:
      - source-snapshot
      - build-pages
    if: ${{ needs.build-pages.result == 'success' && needs.source-snapshot.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      deploy_seconds: ${{ steps.deploy-clock.outputs.deploy_seconds }}
      public_epoch: ${{ steps.deploy-clock.outputs.public_epoch }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deploy-start
        name: Start deploy timer
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - id: deploy-clock
        name: Record deploy duration and public timestamp
        env:
          DEPLOY_STARTED_EPOCH: ${{ steps.deploy-start.outputs.epoch }}
        shell: bash
        run: |
          public_epoch="$(date +%s)"
          echo "public_epoch=$public_epoch" >> "$GITHUB_OUTPUT"
          echo "deploy_seconds=$((public_epoch - DEPLOY_STARTED_EPOCH))" >> "$GITHUB_OUTPUT"

  verify-public:
    name: 驗證公開站台與版本 metadata
    needs:
      - resolve-source
      - source-snapshot
      - build-pages
      - deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Smoke test homepage, Analyzer, deployment and stock data
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WEBSITE_SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          MARKET_SOURCE_SHA: ${{ needs.source-snapshot.outputs.market_data_source_sha }}
          MARKET_ARTIFACT_ID: ${{ needs.source-snapshot.outputs.market_artifact_id }}
          MARKET_ARTIFACT_DIGEST: ${{ needs.source-snapshot.outputs.market_artifact_digest }}
          DEPLOYMENT_RECORD_ARTIFACT_ID: ${{ needs.build-pages.outputs.deployment_record_artifact_id }}
          DEPLOY_MODE: ${{ needs.resolve-source.outputs.mode }}
          ROLLBACK_SOURCE_RECORD_ID: ${{ inputs.rollback_artifact_id }}
          SNAPSHOT_STRATEGY: ${{ needs.source-snapshot.outputs.snapshot_strategy }}
          WORKFLOW_STARTED_EPOCH: ${{ needs.resolve-source.outputs.workflow_started_epoch }}
          PUBLIC_EPOCH: ${{ needs.deploy.outputs.public_epoch }}
          WEBSITE_BUILD_SECONDS: ${{ needs.build-pages.outputs.website_build_seconds }}
          DEPLOY_SECONDS: ${{ needs.deploy.outputs.deploy_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          smoke_started="$(date +%s)"
          base="${PAGE_URL%/}"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/" > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/analyzer" > /dev/null
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/deployment-version.json" > "$RUNNER_TEMP/public-deployment.json"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/data/manifest.json" > "$RUNNER_TEMP/public-manifest.json"
          stock_path="$(python - "$RUNNER_TEMP/public-deployment.json" "$RUNNER_TEMP/public-manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          deployment = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected = {
              "websiteSourceCommit": os.environ["WEBSITE_SOURCE_SHA"],
              "marketDataSourceCommit": os.environ["MARKET_SOURCE_SHA"],
              "marketArtifactId": int(os.environ["MARKET_ARTIFACT_ID"]),
              "marketArtifactDigest": os.environ["MARKET_ARTIFACT_DIGEST"],
          }
          if os.environ["DEPLOY_MODE"] == "rollback":
              expected["rollbackSourceDeploymentRecordId"] = int(
                  os.environ["ROLLBACK_SOURCE_RECORD_ID"]
              )
          for key, value in expected.items():
              if deployment.get(key) != value:
                  raise SystemExit(f"公開 deployment metadata 的 {key} 不一致。")
          symbols = manifest.get("symbols")
          if not isinstance(symbols, list) or not symbols or not isinstance(symbols[0], dict):
              raise SystemExit("公開 manifest 缺少股票索引。")
          path = symbols[0].get("dataPath")
          if not isinstance(path, str) or not path.startswith("data/stocks/"):
              raise SystemExit("公開 manifest 的股票資料路徑無效。")
          print(path)
          PY
          )"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$base/$stock_path" > /dev/null
          finished_epoch="$(date +%s)"
          smoke_seconds="$((finished_epoch - smoke_started))"
          time_to_public="$((PUBLIC_EPOCH - WORKFLOW_STARTED_EPOCH))"
          workflow_complete="$((finished_epoch - WORKFLOW_STARTED_EPOCH))"
          {
            echo "### 公開站台驗收"
            echo "- 首頁、Analyzer、deployment-version.json、manifest 與股票資料：通過"
            echo "- Deployment record Artifact：\`$DEPLOYMENT_RECORD_ARTIFACT_ID\`"
            echo "- 網站 build：\`${WEBSITE_BUILD_SECONDS}s\`"
            echo "- Pages deploy：\`${DEPLOY_SECONDS}s\`"
            echo "- 公開 smoke：\`${smoke_seconds}s\`"
            echo "- Time-to-public：\`${time_to_public}s\`"
            echo "- Workflow complete：\`${workflow_complete}s\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SNAPSHOT_STRATEGY" == "snapshot-reuse" ]] && (( time_to_public > 300 || workflow_complete > 300 )); then
            echo "純前端快速部署超過 5 分鐘 Gate。" >&2
            exit 1
          fi
